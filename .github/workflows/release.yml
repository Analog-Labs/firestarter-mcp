name: Release

# Releasing is a merge, not a manual push.
#
# Bump the version in a PR — `npm version <x.y.z> --no-git-tag-version`, which
# fires the `version` lifecycle and syncs all five files that state it. When
# that PR merges, this workflow sees a version with no matching tag, runs the
# same gates CI runs, then creates the tag and the release.
#
# Ordinary merges that do not touch the version are a no-op: the tag already
# exists, so the release job is skipped entirely.
#
# This is why nobody needs push rights on main. Branch protection restricts
# branches, not tags, so the Actions token can create v<version> even though it
# cannot push a commit to a protected main. The version bump arrives through
# code review like any other change.
#
# That reasoning covers tagging only. This workflow also publishes to npm, and
# branch protection does NOT contain that — see the environment binding on the
# release job for why, and for what has to be configured outside this file.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never let two releases race. Not cancel-in-progress: a half-finished release
# that gets cancelled leaves a tag with no assets attached to it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── Is this commit a release? ───────────────────────────────────────────────
  # Split out so the expensive gates below are skipped outright on the ordinary
  # merges that make up most pushes to main.
  decide:
    name: Check whether package.json's version is already tagged
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to tell a new version from an old one

      - name: Check
        id: check
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "${tag} is already tagged — nothing to release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "${tag} is new — releasing."
          fi

  release:
    name: Build, tag, and attach the extension bundle and npm tarball
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    # id-token lets npm's trusted-publishing OIDC exchange run, which is what
    # removes the need for an npm token anywhere in this repo. contents must be
    # restated: job-level permissions REPLACE the workflow-level block above,
    # they do not merge with it, and gh release create needs contents: write.
    permissions:
      contents: write
      id-token: write
    # THE branch guard for publishing, and it has to live here rather than in
    # an `if:` further down. npm's trusted publisher matches on {org, repo,
    # workflow filename, environment} — there is NO ref in that tuple. Combined
    # with workflow_dispatch (and push, which an attacker can add to their own
    # copy) running the workflow file FROM THE SELECTED REF, anyone with write
    # access could otherwise branch, rewrite this file to strip the gates,
    # dispatch it, and publish as `latest` with a valid provenance attestation
    # that faithfully records their branch. main's push restriction never gets
    # involved, because nothing is pushed to main.
    #
    # An in-file `if: github.ref == 'refs/heads/main'` cannot fix that: it sits
    # in the file being rewritten. Only an out-of-file binding holds, so this
    # environment MUST be configured with "Deployment branches and tags:
    # Selected branches -> main", and the npm trusted publisher MUST name this
    # same environment. If npm's environment field is left blank, an attacker
    # simply deletes this line on their branch and publishes anyway.
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      # Same gates as CI — a release must never ship something main wouldn't.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:mcpb
      - run: npx mcpb validate mcpb/manifest.json
      - run: node scripts/smoke-bundle.mjs

      # The tag is derived from package.json, so those two agree by construction.
      # The other four files that state the version do not, unless the bump went
      # through `npm version`. sync-version rewrites them from package.json; if
      # it changes anything, the merged commit was inconsistent — fail rather
      # than ship a bundle whose version lies.
      - name: Check every declared version agrees
        run: |
          set -euo pipefail
          node scripts/sync-version.mjs
          if ! git diff --quiet; then
            echo "::error::version drift in the merged commit — run 'npm run sync-version' and re-merge:"
            git --no-pager diff --stat
            exit 1
          fi
          echo "package.json, both mcp.json manifests, mcpb/manifest.json and server.ts all agree"

      # The installable artifact. firestarter-commerce depends on this tarball by
      # URL rather than on a registry entry: the MCP server has no lifecycle of
      # its own — it only runs inside the API container — so the whole problem is
      # getting the source into one Docker image at build time. A release asset
      # does that over plain HTTPS, with no npm org, no token, no git binary in
      # the runtime image, and none of the ssh rewriting npm applies to git deps.
      # `npm pack` runs `prepare`, so the tarball ships prebuilt.
      #
      # The filename is derived from package.json rather than read back from
      # npm's output. `npm pack --silent` is not silent here: it runs `prepare`,
      # which runs build:mcpb, which prints ~28 lines. Capturing that whole
      # stream into $GITHUB_OUTPUT is what broke the v2.1.0 release —
      # "Invalid format 'Validating manifest...'", because GITHUB_OUTPUT rejects
      # multi-line values. npm derives the name as <name-without-@-and-/>-<version>,
      # so computing it is exact and needs no parsing at all.
      - name: Pack the npm tarball
        id: pack
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name.replace("@","").replace("/","-")')"
          version="$(node -p 'require("./package.json").version')"
          tarball="${name}-${version}.tgz"
          npm pack >/dev/null
          test -f "$tarball" || { echo "::error::expected $tarball, got: $(ls ./*.tgz 2>/dev/null)"; exit 1; }
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "packed $tarball"

      # Publish to npm via OIDC trusted publishing — no token exists anywhere in
      # this repo, which is the point: there is nothing to leak or rotate.
      # Requires npm >= 11.5.1 (Node 22 bundles 10.9.x, hence the upgrade) and a
      # GitHub-hosted runner.
      #
      # The guard tests npm view's OUTPUT, not its exit code: some npm versions
      # exit 0 with empty output for a missing version, and a wholly unpublished
      # package E404s. Both mean "not on the registry" and both must publish.
      # This makes re-runs and the bootstrapped-stub era skip cleanly, which
      # matters because npm forbids republishing a version that already exists —
      # without the guard, any re-run of a completed release fails the job.
      #
      # Publishing the packed tarball rather than the working tree keeps the
      # registry bits byte-identical to the release asset attached below.
      - name: Publish to npm (skipped when the version already exists)
        # Defence in depth only — the environment's deployment-branch rule is
        # the guard that actually holds. This line is in the file an attacker
        # would be rewriting, so it stops an accident, not an adversary.
        if: github.ref == 'refs/heads/main'
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          # Pinned rather than @latest. Trusted publishing needs npm >= 11.5.1;
          # npm@latest is 12.x, whose engines floor is ^22.22.2 while node 22
          # resolves to 22.23.2 — one patch of margin on a step that only runs
          # on release day. npm@^11.5.1 resolves to 11.19.0, engines
          # ^20.17.0 || >=22.9.0, and its OIDC implementation is byte-identical
          # to 12.x's.
          npm install -g npm@^11.5.1
          npm --version
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          existing="$(npm view "${name}@${version}" version 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            echo "${name}@${version} is already on the registry — skipping publish."
          else
            npm publish "$TARBALL" --provenance --access public
            echo "published ${name}@${version} with provenance"
          fi

      # gh release create makes the tag itself, pointed at this commit, so the
      # workflow never pushes to the protected branch.
      - name: Create the tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          gh release create "$TAG" mcpb/dist/*.mcpb "$TARBALL" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

      # No repository_dispatch to firestarter-commerce, deliberately. Commerce
      # consumes releases through Dependabot (its .github/dependabot.yml allows
      # @analog-labs/firestarter-mcp on a daily poll), which needs nothing from
      # this side: it authenticates itself, and its PRs trigger CI, which PRs
      # opened with a github.token do not.
      #
      # An earlier revision notified commerce directly. That required a
      # cross-repo write token stored here, and it could not be scoped properly
      # — fine-grained PATs against this org need an owner to enable them and we
      # are members, so the fallback was a classic repo-scoped token. Trading
      # minutes of latency for deleting that credential is the right way round.
