name: Release

# Releasing is a merge, not a manual push.
#
# Bump the version in a PR — `npm version <x.y.z> --no-git-tag-version`, which
# fires the `version` lifecycle and syncs all five files that state it. When
# that PR merges, this workflow sees a version with no matching tag, runs the
# same gates CI runs, then creates the tag and the release.
#
# Ordinary merges that do not touch the version are a no-op: the tag already
# exists, so the release job is skipped entirely.
#
# This is why nobody needs push rights on main. Branch protection restricts
# branches, not tags, so the Actions token can create v<version> even though it
# cannot push a commit to a protected main. The version bump arrives through
# code review like any other change.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Never let two releases race. Not cancel-in-progress: a half-finished release
# that gets cancelled leaves a tag with no assets attached to it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── Is this commit a release? ───────────────────────────────────────────────
  # Split out so the expensive gates below are skipped outright on the ordinary
  # merges that make up most pushes to main.
  decide:
    name: Check whether package.json's version is already tagged
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags are needed to tell a new version from an old one

      - name: Check
        id: check
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          tag="v${version}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "${tag} is already tagged — nothing to release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "${tag} is new — releasing."
          fi

  release:
    name: Build, tag, and attach the extension bundle and npm tarball
    needs: decide
    if: needs.decide.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Same gates as CI — a release must never ship something main wouldn't.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:mcpb
      - run: npx mcpb validate mcpb/manifest.json
      - run: node scripts/smoke-bundle.mjs

      # The tag is derived from package.json, so those two agree by construction.
      # The other four files that state the version do not, unless the bump went
      # through `npm version`. sync-version rewrites them from package.json; if
      # it changes anything, the merged commit was inconsistent — fail rather
      # than ship a bundle whose version lies.
      - name: Check every declared version agrees
        run: |
          set -euo pipefail
          node scripts/sync-version.mjs
          if ! git diff --quiet; then
            echo "::error::version drift in the merged commit — run 'npm run sync-version' and re-merge:"
            git --no-pager diff --stat
            exit 1
          fi
          echo "package.json, both mcp.json manifests, mcpb/manifest.json and server.ts all agree"

      # The installable artifact. firestarter-commerce depends on this tarball by
      # URL rather than on a registry entry: the MCP server has no lifecycle of
      # its own — it only runs inside the API container — so the whole problem is
      # getting the source into one Docker image at build time. A release asset
      # does that over plain HTTPS, with no npm org, no token, no git binary in
      # the runtime image, and none of the ssh rewriting npm applies to git deps.
      # `npm pack` runs `prepare`, so the tarball ships prebuilt.
      #
      # The filename is derived from package.json rather than read back from
      # npm's output. `npm pack --silent` is not silent here: it runs `prepare`,
      # which runs build:mcpb, which prints ~28 lines. Capturing that whole
      # stream into $GITHUB_OUTPUT is what broke the v2.1.0 release —
      # "Invalid format 'Validating manifest...'", because GITHUB_OUTPUT rejects
      # multi-line values. npm derives the name as <name-without-@-and-/>-<version>,
      # so computing it is exact and needs no parsing at all.
      - name: Pack the npm tarball
        id: pack
        run: |
          set -euo pipefail
          name="$(node -p 'require("./package.json").name.replace("@","").replace("/","-")')"
          version="$(node -p 'require("./package.json").version')"
          tarball="${name}-${version}.tgz"
          npm pack >/dev/null
          test -f "$tarball" || { echo "::error::expected $tarball, got: $(ls ./*.tgz 2>/dev/null)"; exit 1; }
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "packed $tarball"

      # gh release create makes the tag itself, pointed at this commit, so the
      # workflow never pushes to the protected branch.
      - name: Create the tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          gh release create "$TAG" mcpb/dist/*.mcpb "$TARBALL" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
